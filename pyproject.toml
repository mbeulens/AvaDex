[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avadex"
version = "0.1.20"
description = "Local CLI agent powered by Ana's Ava assistant"
authors = [{name = "Martijn Beulens", email = "m.beulens@syntec-it.nl"}]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "prompt_toolkit>=3.0",
    "tomli-w>=1.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "pytest-asyncio>=0.23",
]

[project.scripts]
avadex = "avadex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["avadex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
